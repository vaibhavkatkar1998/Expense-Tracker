<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Register - Spendly</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<div th:insert="~{layout :: header}"></div>

<main class="page-content">
    <h1>Create your account</h1>

    <p class="error-message" th:if="${error}" th:text="${error}"></p>

    <form th:action="@{/register}" method="post">
        <div class="form-field">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" th:value="${name}" required/>
        </div>
        <div class="form-field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" th:value="${email}" required/>
        </div>
        <div class="form-field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required/>
        </div>
        <button type="submit" class="btn-primary">Register</button>
    </form>

    <p class="form-footer-link">
        Already have an account? <a th:href="@{/login}">Log in</a>
    </p>
</main>

<div th:insert="~{layout :: footer}"></div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
