<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Spendly</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<header th:fragment="header" class="site-header">
    <a th:href="@{/}" class="brand">Spendly</a>
    <div class="header-actions">
        <th:block th:if="${sessionUserName} != null">
            <span class="user-chip" th:text="'Hi, ' + ${sessionUserName}"></span>
            <a th:href="@{/logout}" class="btn-logout">Log out</a>
        </th:block>
        <th:block th:if="${sessionUserName} == null">
            <a th:href="@{/login}" class="btn-signin">Sign In</a>
        </th:block>
    </div>
</header>

<footer th:fragment="footer" class="site-footer">
    <p>&copy; Spendly</p>
</footer>

</body>
</html>
